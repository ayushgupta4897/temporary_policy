# ---------------------------------------------------------------------------

#
# This file configures the New Relic Python Agent.
#
# The path to the configuration file should be supplied to the function
# newrelic.agent.initialize() when the agent is being initialized.
#
# The configuration file follows a structure similar to what you would
# find for Microsoft Windows INI files. For further information on the
# configuration file format see the Python ConfigParser documentation at:
#
#    http://docs.python.org/library/configparser.html
#
# For further discussion on the behaviour of the Python agent that can
# be configured via this configuration file see:
#
#    http://newrelic.com/docs/python/python-agent-configuration
#

# ---------------------------------------------------------------------------

# Here are the settings that are common to all environments.

[newrelic]

# You must specify the license key associated with your New Relic
# account. This key binds the Python Agent's data to your account in
# the New Relic service.
license_key = 186d881697b43200d0c7d18030a9708fFFFFNRAL

# The application name. Set this to be descriptive of your
# application. This name is used as the top-level identifier for
# your application data in the New Relic service.
app_name = Policy Intelligence Backend

# When "true", the agent collects performance data about your
# application and reports this data to the New Relic service for
# analysis. This global switch is normally overridden for each
# environment below.
monitor_mode = true

# Sets the name of a file to log agent messages to. Useful for
# debugging any issues with the agent. This is not set by
# default as it is not known in advance what user your web
# application processes will run as and where they have permission
# to write to. Whatever you set this to you must ensure that the
# permissions for the containing directory and the file itself are
# correct, and that the user that your web application runs as can
# write to the file. If not able to write out a log file, it is
# also possible to say "stderr" and output to standard error output.
# This would normally result in output appearing in your web server
# log.
#log_file = /tmp/newrelic-python-agent.log

# Sets the level of detail of messages sent to the log file, if
# a log file location has been provided. Possible values, in
# increasing order of detail, are: "critical", "error", "warning",
# "info" and "debug". When reporting any agent issues to New Relic
# technical support, the most useful setting for the support team is
# "debug". However, this can generate a lot of information very
# quickly, so it is best not to keep the agent at this level for
# longer than it takes to reproduce the problem you are experiencing.
log_level = info

# High Security Mode (requires High Security Mode to be activated in the UI)
high_security = false

# The Python Agent will attempt to connect directly to the New Relic
# service. If there is an intermediate firewall between your host and the
# New Relic service that requires you to use a HTTP proxy, then you should
# set both the "proxy_host" and "proxy_port" settings to the required values
# for the HTTP proxy. The "proxy_user" and "proxy_pass" settings should
# additionally be set if proxy authentication is implemented by the HTTP proxy.
# The "proxy_scheme" setting dictates what protocol scheme is used in talking
# to the HTTP proxy. This would normally always be set as "http" which will
# result in the agent then using a SSL tunnel through the HTTP proxy for end to
# end encryption.
# proxy_scheme = http
# proxy_host = hostname
# proxy_port = 8080
# proxy_user =
# proxy_pass =

# Capturing request parameters is off by default. To enable the
# capturing of request parameters, first ensure that the setting
# "attributes.enabled" is set to "true" (the default value), and
# then add "request.parameters.*" to the "attributes.include"
# setting. For details about attributes configuration, please
# consult the documentation.
# attributes.include = request.parameters.*

# The transaction tracer captures deep information about slow
# transactions and sends this to the service once per
# minute. Included in the transaction is the exact call sequence of
# the transactions including any SQL statements issued.
transaction_tracer.enabled = true

# Threshold in seconds for when to collect a transaction
# trace. When the response time of a controller action exceeds
# this threshold, a transaction trace will be recorded and sent to
# the service. Valid values are any float value, or (default)
# "apdex_f", which will use the threshold for an dissatisfying
# Apdex controller action - four times the Apdex T value.
transaction_tracer.transaction_threshold = apdex_f

# When the transaction tracer is on, SQL statements can
# optionally be recorded. The recorder has three modes, "off"
# which sends no SQL, "raw" which sends the SQL statement in its
# original form, and "obfuscated", which strips out numeric and
# string literals.
transaction_tracer.record_sql = obfuscated

# Threshold in seconds for when to collect stack trace for a SQL
# call. In other words, when SQL statements exceed this threshold,
# then capture and send to the service a stack trace. This is
# helpful for pinpointing where long SQL calls originate from.
transaction_tracer.stack_trace_threshold = 0.5

# Determines whether the agent will capture query plans for slow
# SQL queries. Only supported in MySQL and PostgreSQL. Should be
# set to "false" when using other database engines.
# transaction_tracer.explain_enabled = true

# Threshold for query execution time below which query plans will
# not be captured. Relevant only when "explain_enabled" is true.
# transaction_tracer.explain_threshold = 0.5

# Space separated list of function or method names in form
# 'module:function' or 'module:class.function' for which
# additional function timing instrumentation will be added.
# function_trace =

# The error collector captures information about uncaught
# exceptions and sends them to the service for viewing.
error_collector.enabled = true

# To stop specific exceptions from reporting to the service, set this property
# to a comma separated list of full exception classes.
# error_collector.ignore_errors =

# Browser monitoring is the Real User Monitoring feature of the UI.
# For those Python web frameworks that are supported, this
# setting enables the auto-insertion of the browser monitoring
# JavaScript fragments.
browser_monitoring.auto_instrument = true

# A thread profiling session can be scheduled via the UI when this
# option is enabled. The thread profiler will periodically capture a
# snapshot of the call stack for each active thread in the web application
# to construct a statistically representative call tree.
thread_profiler.enabled = true

# Distributed tracing lets you see the path that a request takes through your
# distributed system. Enabling distributed tracing changes the behavior of some
# New Relic features, so carefully consult the transition guide before you enable
# this feature: https://docs.newrelic.com/docs/transition-guide-distributed-tracing
distributed_tracing.enabled = true

# ---------------------------------------------------------------------------

#
# The application environments. These are specific settings which
# override the common environment settings. The settings related to a
# specific environment will be used when the environment argument to the
# newrelic.agent.initialize() function has been defined to be either
# "development", "test", "staging" or "production".
#

[newrelic:development]
monitor_mode = false

[newrelic:test]
monitor_mode = false

[newrelic:staging]
app_name = Policy Intelligence Backend (Staging)
monitor_mode = true

[newrelic:production]
monitor_mode = true

# ---------------------------------------------------------------------------
