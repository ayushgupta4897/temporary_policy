# Azure Container Apps Configuration
# Policy Intelligence Platform Deployment
#
# IMPORTANT: This file uses placeholder variables that should be replaced
# at deployment time. Use envsubst or sed to replace:
#   - ${AZURE_SUBSCRIPTION_ID}
#   - ${AZURE_RESOURCE_GROUP}
#   - ${AZURE_ENVIRONMENT_NAME}
#   - ${BACKEND_URL}

apiVersion: 2023-05-01
location: ${AZURE_LOCATION}
name: policy-intelligence-app
resourceGroup: ${AZURE_RESOURCE_GROUP}

properties:
  environmentId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.App/managedEnvironments/${AZURE_ENVIRONMENT_NAME}
  
  configuration:
    activeRevisionsMode: single
    ingress:
      external: true
      targetPort: 3000
      transport: auto
      allowInsecure: false
      traffic:
        - weight: 100
          latestRevision: true
    
    registries:
      - server: ${AZURE_REGISTRY_NAME}.azurecr.io
        identity: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-policy-intelligence
    
    secrets:
      - name: azure-storage-connection
        value: "AZURE_STORAGE_CONNECTION_STRING_VALUE"
      - name: registry-password
        value: "REGISTRY_PASSWORD_VALUE"

  template:
    containers:
      # Backend Container
      - name: backend
        image: ${AZURE_REGISTRY_NAME}.azurecr.io/policy-backend:latest
        env:
          - name: AZURE_STORAGE_CONNECTION_STRING
            secretRef: azure-storage-connection
        resources:
          cpu: 0.5
          memory: 1.0Gi
        probes:
          - type: liveness
            httpGet:
              path: "/health"
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          - type: readiness
            httpGet:
              path: "/health" 
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

      # Frontend Container
      - name: frontend
        image: ${AZURE_REGISTRY_NAME}.azurecr.io/policy-frontend:latest
        env:
          - name: NODE_ENV
            value: "production"
          - name: NEXT_PUBLIC_API_BASE_URL
            value: "${BACKEND_URL}"
        resources:
          cpu: 0.25
          memory: 0.5Gi
        probes:
          - type: liveness
            httpGet:
              path: "/"
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          - type: readiness
            httpGet:
              path: "/"
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

    scale:
      minReplicas: 1
      maxReplicas: 5
      rules:
        - name: http-scaling
          http:
            metadata:
              concurrentRequests: "10"
