<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Strategy& Logo - White Version for Dark Backgrounds -->
  <!-- Red Square with White Ampersand -->
  <rect x="0" y="0" width="60" height="60" fill="#A32020" rx="4"/>
  <text x="30" y="48" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">&amp;</text>

  <!-- "strategy&" text in white -->
  <text x="70" y="35" font-family="Georgia, serif" font-size="24" font-weight="normal" fill="#ffffff">strategy&amp;</text>

  <!-- "Part of the PwC network" subtext in light gray -->
  <text x="70" y="50" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#cccccc">Part of the PwC network</text>
</svg>
