# Docker Compose for Policy Intelligence Platform
# For local testing and development

version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: policy-backend
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - policy-network

  # Frontend Web Service  
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: policy-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - policy-network

networks:
  policy-network:
    driver: bridge

# Volumes for persistent data (if needed)
volumes:
  policy-data:
